services:
  postgres:
    image: postgres:17-alpine
    container_name: openf1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openf1
      POSTGRES_USER: openf1
      POSTGRES_PASSWORD: openf1
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openf1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openf1 -d openf1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    user: "1000:0"
    profiles: ["execucao"]
    environment:
      OPENF1_DATA_ROOT: /app/data
      POSTGRES_URL: postgresql+psycopg://openf1:openf1@postgres:5432/openf1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  metabase-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_local
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.63.16
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: metabase-db
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_local
      JAVA_OPTS: -Xmx768m
    depends_on:
      metabase-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    profiles: ["orquestracao"]
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: almeida:admin
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      OPENF1_DATA_ROOT: /opt/project/data
      OPENF1_SCHEDULE: ${OPENF1_SCHEDULE:-}
      POSTGRES_URL: postgresql+psycopg://openf1:openf1@postgres:5432/openf1
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/project/data
      - ./logs:/opt/project/logs
    user: "1000:0"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  openf1_postgres_data:
  metabase_data:
  airflow_data:
